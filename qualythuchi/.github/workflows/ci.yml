name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, unit, build and mobile browsers
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      VITE_API_BASE_URL: ''
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
            printf '%s\n' 'Commit the generated package-lock.json from tested-build for reproducible installs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and deployment configuration tests
        run: npm test
      - name: Build frontend and bundle Worker
        run: npm run build
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Real local Workers/D1 and mobile browser tests
        run: npx playwright test
      - name: Store tested frontend and dependency lock
        uses: actions/upload-artifact@v7
        with:
          name: tested-build
          path: |
            apps/frontend/dist/
            package-lock.json
          if-no-files-found: error
          retention-days: 14
      - name: Store browser report and failure traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-browser-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
