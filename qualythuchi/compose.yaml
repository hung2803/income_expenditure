name: thu-chi

services:
  backend:
    build:
      context: .
      target: backend
    init: true
    # Optional ignored local keys; generated by the notifications:keys command.
    env_file:
      - path: ./apps/backend/.dev.vars.dev
        required: false
    environment:
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
      CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"
      WRANGLER_SEND_METRICS: "false"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - d1-data:/app/apps/backend/.wrangler
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

  frontend:
    build:
      context: .
      target: frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    init: true
    environment:
      API_PROXY_TARGET: http://backend:8787
    ports:
      - "0.0.0.0:5173:5173"
    # The login UI can run before the backend is available.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173').then(async r => { const html = await r.text(); if (!r.ok || !html.includes('/assets/') || html.includes('/@vite/client')) process.exit(1); }).catch(() => process.exit(1));"
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6

volumes:
  d1-data:
